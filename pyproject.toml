[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["bin/codex-backup", "bin/codex-health", "bin/codex-job", "bin/codex-resource", "bin/codex-resource-host"]
exclude = ["docs/plans"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
