name: Test Codex CLI Farm

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run Python lint
        run: ruff check .

      - name: Check Bash syntax
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -l '^#!/usr/bin/env bash')

      - name: Run ShellCheck
        run: git grep -l -z '^#!/usr/bin/env bash' | xargs -0 shellcheck --severity=warning

      - name: Run unit tests
        run: CODEX_ANNOTATOR_AUTOSTART=0 python -m unittest discover -s tests -v

      - name: Run isolated validation
        if: matrix.python-version == '3.13'
        run: ./validate.sh

      - name: Run isolated demo
        if: matrix.python-version == '3.13'
        run: ./examples/demo.sh

      - name: Install pinned tmux-deep-history release
        if: matrix.python-version == '3.13'
        run: python integrations/install_tmux_deep_history.py

      - name: Run deep-history integration
        if: matrix.python-version == '3.13'
        run: ./tests/integration/deep_history_smoke.sh
