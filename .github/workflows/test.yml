name: Test Agent CLI Farm

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run Python lint
        run: ruff check .

      - name: Check Bash syntax
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git grep -l '^#!/usr/bin/env bash')

      - name: Run ShellCheck
        run: git grep -l -z '^#!/usr/bin/env bash' | xargs -0 shellcheck --severity=warning

      - name: Run unit tests
        run: CODEX_ANNOTATOR_AUTOSTART=0 python -m unittest discover -s tests -v

      - name: Run isolated validation
        if: matrix.python-version == '3.13'
        run: ./validate.sh

      - name: Run isolated demo
        if: matrix.python-version == '3.13'
        run: ./examples/demo.sh

      - name: Run exact session resume integration
        if: matrix.python-version == '3.13'
        run: ./tests/integration/session_resume_smoke.sh

      - name: Install pinned tmux-deep-history release
        if: matrix.python-version == '3.13'
        run: python integrations/install_tmux_deep_history.py

      - name: Run deep-history integration
        if: matrix.python-version == '3.13'
        run: ./tests/integration/deep_history_smoke.sh

  macos-launchers:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Use macOS system Bash for launcher shebangs
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
          /bin/bash --version
      - name: Test launch and restore with Bash 3.2
        run: >-
          python -m unittest -v
          tests.test_add_scripts.AddScriptsTests
          tests.test_add_scripts.RestoreScriptTests

  windows-thermal-helpers:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows helpers without installing them
        shell: powershell
        run: |
          $found = @()
          Get-ChildItem tools/thermal-windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { $found += $parseErrors }
          }
          if ($found.Count) { throw ($found | Out-String) }
      - name: Exercise atomic publication and watchdog decisions without hardware or tasks
        shell: powershell
        run: ./tools/thermal-windows/sensor.ps1 -SelfTest
